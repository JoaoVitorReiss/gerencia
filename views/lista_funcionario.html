<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="/img/icon/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="/css/style_listaFuncionario.css">
    <title>Lista de funcionario</title>
</head>
<body>
    <nav>
        <a href="dashboard_adm" title="Voltar para a Dashboard"> <svg xmlns="http://www.w3.org/2000/svg" height="45px" viewBox="0 -960 960 960" width="45px" fill="#325088"><path d="M280-200v-80h284q63 0 109.5-40T720-420q0-60-46.5-100T564-560H312l104 104-56 56-200-200 200-200 56 56-104 104h252q97 0 166.5 63T800-420q0 94-69.5 157T564-200H280Z"/></svg></a>
    </nav>
    
    <div class="container">
        <div class="toolbar">
            <input type="text" id="busca" placeholder="Buscar por nome, email ou CPF..." onkeyup="filtrarTabela()">
            <select id="filtro-status" onchange="filtrarTabela()">
                <option value="">Todos os status</option>
                <option value="online">🟢 Online</option>
                <option value="ausente">🟠 Ausente</option>
                <option value="offline">🔴 Offline</option>
            </select>
        </div>

        <table id="tabela-funcionarios">
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Telefone</th>
                    <th>Nível</th>
                    <th>Salário</th>
                    <th>Status</th>
                    <th>Última Atividade</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tbody-funcionarios">
                <!-- Preenchido via JavaScript -->
            </tbody>
        </table>
    </div>


    <div class="card">
        <section>
            <h2>Historico de funcionarios da empresa:</h2> 
            <button id="btn_show"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M80-200v-80h400v80H80Zm0-200v-80h200v80H80Zm0-200v-80h200v80H80Zm744 400L670-354q-24 17-52.5 25.5T560-320q-83 0-141.5-58.5T360-520q0-83 58.5-141.5T560-720q83 0 141.5 58.5T760-520q0 29-8.5 57.5T726-410l154 154-56 56ZM560-400q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35Z"/></svg></button>
        </section>
    </div>
    <script type="module" src="/js/lista_Funcionarios.js"></script>
</body>
</html>
